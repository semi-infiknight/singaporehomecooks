name: CI

on:
  push:
    branches: [ main, 'integrate/*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/ci-gate.sh build-test-typecheck

  medusa-real-e2e:
    # Full API smoke hits live Railway — run on integrate branches or manual dispatch, not every main push.
    if: startsWith(github.ref, 'refs/heads/integrate/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @shc/types build && pnpm --filter @shc/business-rules build && pnpm --filter @shc/utils build
      - name: E2E against Railway Medusa (local Medusa disabled)
        run: pnpm verify:real-e2e

  mobile-ios-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/ci-gate.sh mobile-ios-guard

  web-pwa-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/ci-gate.sh web-pwa-guard

  maestro-e2e:
    runs-on: macos-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/integrate/')
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Install Maestro + validate flows
        run: |
          chmod +x scripts/maestro-validate.sh
          ./scripts/maestro-validate.sh
      - name: Maestro device run (optional)
        if: vars.MAESTRO_RUN_DEVICE == 'true'
        run: |
          export MAESTRO_RUN_DEVICE=true
          pnpm customer:dev &
          pnpm cook:dev &
          sleep 30
          maestro test apps/mobile-customer/e2e/customer-auth.yaml apps/mobile-cook/e2e/cook-auth.yaml
