# Dismiss cook onboarding when shown after login (rose@ first launch on clearState).
appId: com.singaporehomecooks.cook
---
- runFlow:
    when:
      visible:
        id: "cook-onboarding-screen"
    commands:
      - tapOn:
          id: "cook-onboarding-pdpa-checkbox"
          optional: true
      - tapOn:
          id: "cook-onboarding-terms-checkbox"
          optional: true
      - repeat:
          times: 10
          commands:
            - tapOn:
                id: "cook-onboarding-skip-btn"
                optional: true
            - tapOn:
                id: "cook-onboarding-next-btn"
                optional: true
            - tapOn:
                id: "cook-onboarding-finish-btn"
                optional: true
