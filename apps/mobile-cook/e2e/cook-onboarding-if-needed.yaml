# Dismiss multi-step cook onboarding when shown after login (rose@ first launch on clearState).
appId: com.singaporehomecooks.cook
---
- runFlow:
    when:
      visible:
        id: "cook-onboarding-screen"
    commands:
      - tapOn:
          id: "cook-onboarding-next-btn"
      - tapOn:
          id: "cook-onboarding-next-btn"
      - tapOn:
          id: "cook-onboarding-next-btn"
      - extendedWaitUntil:
          visible: "Safety & PDPA"
          timeout: 15000
      - scrollUntilVisible:
          element:
            id: "cook-onboarding-pdpa-checkbox"
          direction: DOWN
          timeout: 20000
      - tapOn:
          id: "cook-onboarding-pdpa-checkbox"
      - tapOn:
          id: "cook-onboarding-finish-btn"
