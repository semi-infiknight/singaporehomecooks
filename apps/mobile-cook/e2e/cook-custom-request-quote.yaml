# Cook — send per-line quote on Maestro custom request (Phase 4)
# Prereq: custom-request-wizard.yaml posted a request with Maestro dish names.
# Run: maestro test apps/mobile-cook/e2e/cook-custom-request-quote.yaml
appId: com.singaporehomecooks.cook
---
- launchApp:
    stopApp: true
- runFlow: cook-signed-in.yaml
- openLink: shc-cook:///(cook)/dashboard/requests
- extendedWaitUntil:
    visible:
      id: "cook-custom-requests-screen"
    timeout: 90000
- scrollUntilVisible:
    element:
      text: "Maestro Laksa E2E"
    direction: DOWN
    timeout: 120000
- tapOn:
    id: "cook-open-request-.*"
    optional: true
- extendedWaitUntil:
    visible:
      id: "cook-custom-request-detail"
    timeout: 60000
    optional: true
- scrollUntilVisible:
    element:
      id: "cook-request-dish-.*"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "cook-request-dish-.*"
- extendedWaitUntil:
    visible:
      id: "quote-price-.*"
    timeout: 30000
- tapOn:
    id: "quote-price-.*"
- inputText: "45"
- hideKeyboard
- tapOn:
    id: "cook-request-dish-done"
- scrollUntilVisible:
    element:
      id: ".*-send"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "quote-builder-.*-send"
- extendedWaitUntil:
    visible:
      id: "cook-saved-quote-.*"
    timeout: 90000
