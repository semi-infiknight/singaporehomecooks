# Cook app — sign-up (WhatsApp phone verify) + immersive onboarding v2
# Run: maestro test apps/mobile-cook/e2e/onboarding.yaml
appId: com.singaporehomecooks.cook
---
- runScript: cook-e2e-mobile.js
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible: "Log in or sign up"
    timeout: 90000
- tapOn:
    id: "auth-mobile-input"
- inputText: ${output.cookMobile}
- tapOn:
    id: "auth-submit-btn"
- extendedWaitUntil:
    visible:
      id: "auth-otp-input"
    timeout: 30000
- tapOn:
    id: "auth-otp-input"
- inputText: "123456"
- tapOn:
    id: "auth-submit-btn"
- extendedWaitUntil:
    visible:
      id: "cook-onboarding-screen"
    timeout: 60000
- repeat:
    times: 8
    commands:
      - tapOn:
          id: "cook-onboarding-next-btn"
      - extendedWaitUntil:
          visible:
            id: "cook-onboarding-screen"
          timeout: 15000
- tapOn:
    id: "cook-onboarding-finish-btn"
- extendedWaitUntil:
    visible:
      id: "cook-dashboard"
    timeout: 90000
