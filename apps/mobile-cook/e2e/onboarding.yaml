# Cook app — sign-up (WhatsApp message-us verify) + immersive onboarding v2
# Run: maestro test apps/mobile-cook/e2e/onboarding.yaml
appId: com.singaporehomecooks.cook
---
- runScript: cook-e2e-email.js
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible: "SHC Cook Portal"
    timeout: 90000
- tapOn: "New home cook? Create an account"
- extendedWaitUntil:
    visible:
      id: "auth-email-input"
    timeout: 15000
- tapOn:
    id: "auth-email-input"
- inputText: ${output.cookEmail}
- tapOn:
    id: "auth-password-input"
- inputText: "maestrosecret1"
- tapOn:
    id: "auth-mobile-input"
- inputText: "91234567"
- tapOn:
    id: "auth-submit-btn"
- extendedWaitUntil:
    visible:
      id: "auth-otp-input"
    timeout: 30000
- tapOn:
    id: "auth-otp-input"
- inputText: "123456"
- tapOn:
    id: "auth-submit-btn"
- extendedWaitUntil:
    visible:
      id: "cook-onboarding-screen"
    timeout: 60000
- repeat:
    times: 18
    commands:
      - tapOn:
          id: "cook-onboarding-next-btn"
      - extendedWaitUntil:
          visible:
            id: "cook-onboarding-screen"
          timeout: 15000
- tapOn:
    id: "cook-onboarding-finish-btn"
- extendedWaitUntil:
    visible:
      id: "cook-dashboard"
    timeout: 90000
