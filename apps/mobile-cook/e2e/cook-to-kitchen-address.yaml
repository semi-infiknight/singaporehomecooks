# Sign up → navigate to kitchen address step (step 9)
# Run: maestro test -e COOK_MOBILE=90025225 apps/mobile-cook/e2e/cook-to-kitchen-address.yaml
appId: com.singaporehomecooks.cook
env:
  COOK_MOBILE: "90025225"
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible: "Log in or sign up"
    timeout: 90000
- tapOn:
    id: "auth-mobile-input"
- inputText: ${COOK_MOBILE}
- tapOn:
    id: "auth-submit-btn"
- extendedWaitUntil:
    visible:
      id: "auth-otp-input"
    timeout: 30000
- tapOn:
    id: "auth-otp-input"
- inputText: "123456"
- tapOn:
    id: "auth-submit-btn"
- extendedWaitUntil:
    visible:
      id: "cook-onboarding-screen"
    timeout: 90000
# welcome → area
- tapOn:
    id: "cook-onboarding-next-btn"
- tapOn:
    id: "cook-onboarding-area-input"
- inputText: "Tampines"
- tapOn:
    id: "cook-onboarding-next-btn"
# paynow (same as WhatsApp prefilled)
- tapOn:
    id: "cook-onboarding-next-btn"
# legal
- tapOn:
    id: "cook-onboarding-pdpa-checkbox"
- tapOn:
    id: "cook-onboarding-terms-checkbox"
- tapOn:
    id: "cook-onboarding-next-btn"
# profile photo — skip
- tapOn:
    id: "cook-onboarding-skip-btn"
# responsible person
- tapOn:
    id: "cook-onboarding-responsible-name"
- inputText: "Test Cook"
- tapOn:
    id: "cook-onboarding-next-btn"
# nric
- tapOn:
    id: "cook-onboarding-nric"
- inputText: "123B"
- tapOn:
    id: "cook-onboarding-next-btn"
# alternate contact — skip
- tapOn:
    id: "cook-onboarding-skip-btn"
- extendedWaitUntil:
    visible:
      id: "cook-onboarding-kitchen-address"
    timeout: 15000
