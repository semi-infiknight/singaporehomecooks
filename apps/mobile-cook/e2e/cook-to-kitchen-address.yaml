# Sign up → kitchen name + address search (step 1)
# Run: maestro test -e COOK_MOBILE=90025225 apps/mobile-cook/e2e/cook-to-kitchen-address.yaml
appId: com.singaporehomecooks.cook
env:
  COOK_MOBILE: "90025225"
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible: "Log in or sign up"
    timeout: 90000
- tapOn:
    id: "auth-mobile-input"
- inputText: ${COOK_MOBILE}
- tapOn:
    id: "auth-submit-btn"
- extendedWaitUntil:
    visible:
      id: "auth-otp-input"
    timeout: 30000
- tapOn:
    id: "auth-otp-input"
- inputText: "123456"
- tapOn:
    id: "auth-submit-btn"
- extendedWaitUntil:
    visible:
      id: "cook-onboarding-kitchen-address"
    timeout: 90000
- tapOn:
    id: "location-search-input"
