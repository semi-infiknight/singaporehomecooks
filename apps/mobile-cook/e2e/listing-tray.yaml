# Cook listings — long-press tray flow (Family Values)
# Prereq: cook app installed on simulator with API reachable
# Run: maestro test --device <id> apps/mobile-cook/e2e/listing-tray.yaml
appId: com.singaporehomecooks.cook
---
- launchApp:
    stopApp: true
- runFlow:
    when:
      visible: "Sign in as cook"
    commands:
      - extendedWaitUntil:
          visible:
            id: "auth-submit-btn"
          timeout: 60000
      - tapOn:
          id: "auth-submit-btn"
      - tapOn:
          text: "OK"
          optional: true
- runFlow: cook-onboarding-if-needed.yaml
- extendedWaitUntil:
    visible:
      id: "cook-dashboard"
    timeout: 120000
    optional: true
# Deep link — iOS tab press can fail; deep link may also surface auth gate
- openLink: shc-cook:///(cook)/listings
- tapOn:
    text: "Open"
    optional: true
- runFlow:
    when:
      visible: "Sign in as cook"
    commands:
      - tapOn:
          id: "auth-submit-btn"
      - tapOn:
          text: "OK"
          optional: true
- tapOn:
    text: "Dismiss"
    optional: true
- tapOn:
    text: "Minimize"
    optional: true
- extendedWaitUntil:
    visible:
      id: "cook-listings-screen"
    timeout: 120000
- extendedWaitUntil:
    visible:
      id: "listing-card-e2e"
    timeout: 90000
- scrollUntilVisible:
    element:
      id: "listing-card-e2e"
    direction: DOWN
    timeout: 30000
    optional: true
- longPressOn:
    id: "listing-card-e2e"
- extendedWaitUntil:
    visible:
      id: "listing-actions-tray"
    timeout: 10000
- tapOn:
    text: "Delete listing"
- extendedWaitUntil:
    visible:
      id: "listing-delete-confirm-tray"
    timeout: 10000
- tapOn:
    text: "Cancel"