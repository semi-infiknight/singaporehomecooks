# Cook listings — long-press tray flow (Family Values)
# Prereq: cook app installed on simulator with API reachable
# Run: maestro test --device <id> apps/mobile-cook/e2e/listing-tray.yaml
appId: com.singaporehomecooks.cook
---
- launchApp
- extendedWaitUntil:
    visible: "Sign in as cook"
    timeout: 60000
    optional: true
- tapOn:
    id: "auth-submit-btn"
    optional: true
- tapOn:
    text: "OK"
    optional: true
- runFlow:
    when:
      visible: "Welcome, home cook"
    commands:
      - tapOn:
          id: "cook-onboarding-finish-btn"
- extendedWaitUntil:
    visible:
      id: "tab-cook-listings"
    timeout: 120000
- tapOn:
    id: "tab-cook-listings"
- extendedWaitUntil:
    visible:
      id: "listing-card-e2e"
    timeout: 90000
- scrollUntilVisible:
    element:
      id: "listing-card-e2e"
    direction: DOWN
    timeout: 30000
    optional: true
- longPressOn:
    id: "listing-card-e2e"
- extendedWaitUntil:
    visible:
      id: "listing-actions-tray"
    timeout: 10000
- tapOn:
    text: "Delete listing"
- extendedWaitUntil:
    visible:
      id: "listing-delete-confirm-tray"
    timeout: 10000
- tapOn:
    text: "Cancel"