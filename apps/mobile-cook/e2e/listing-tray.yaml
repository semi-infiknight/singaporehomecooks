# Cook listings — long-press tray flow (Family Values)
# Run: maestro test --device <id> apps/mobile-cook/e2e/listing-tray.yaml
appId: com.singaporehomecooks.cook
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "tab-cook-listings"
    timeout: 120000
    optional: true
- tapOn:
    id: "tab-cook-listings"
- extendedWaitUntil:
    visible: "My Listings"
    timeout: 30000
    optional: true
- longPressOn:
    text: "Nyonya"
    optional: true
- extendedWaitUntil:
    visible:
      id: "listing-actions-tray"
    timeout: 10000
    optional: true
- tapOn:
    text: "Delete listing"
    optional: true
- extendedWaitUntil:
    visible:
      id: "listing-delete-confirm-tray"
    timeout: 10000
    optional: true
- tapOn:
    text: "Cancel"
    optional: true