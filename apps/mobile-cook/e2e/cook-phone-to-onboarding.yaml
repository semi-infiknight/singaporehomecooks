# One-shot: fresh phone signup → onboarding (stop before wizard steps)
appId: com.singaporehomecooks.cook
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible: "Log in or sign up"
    timeout: 90000
- tapOn:
    id: "auth-mobile-input"
- inputText: ${COOK_MOBILE}
- tapOn:
    id: "auth-submit-btn"
- extendedWaitUntil:
    visible:
      id: "auth-otp-input"
    timeout: 30000
- tapOn:
    id: "auth-otp-input"
- inputText: "123456"
- tapOn:
    id: "auth-submit-btn"
- extendedWaitUntil:
    visible:
      id: "cook-onboarding-screen"
    timeout: 90000
