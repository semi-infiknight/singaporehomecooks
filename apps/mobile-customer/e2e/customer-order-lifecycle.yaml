# Customer order lifecycle — collected → review (completes fulfilment arc)
# Prereq: cook-order-lifecycle.yaml or cook full-order-fulfil has marked order collected.
# Run after cross-app E2E or standalone when order is on tracking screen.
appId: com.singaporehomecooks.customer
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible:
      id: "customer-discover-screen"
    timeout: 120000
    optional: true
- openLink: shc-customer:///(shared)/auth
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible:
      id: "auth-submit-btn"
    timeout: 30000
    optional: true
- tapOn:
    id: "auth-submit-btn"
    optional: true
- tapOn:
    text: "OK"
    optional: true
- runFlow:
    when:
      visible:
        id: "order-tracking-screen"
    commands:
      - scrollUntilVisible:
          element:
            text: "Collected"
          direction: DOWN
          timeout: 120000
          optional: true
- runFlow:
    when:
      notVisible:
        id: "order-tracking-screen"
    commands:
      - openLink: shc-customer:///(customer)/orders
      - tapOn:
          text: "Open"
          optional: true
      - extendedWaitUntil:
          visible:
            id: "customer-orders-screen"
          timeout: 60000
      - tapOn:
          text: "Nasi Lemak Sambal Prawn"
          optional: true
      - extendedWaitUntil:
          visible:
            id: "order-tracking-screen"
          timeout: 60000
- scrollUntilVisible:
    element:
      id: "open-review-tray-btn"
    direction: DOWN
    timeout: 120000
    optional: true
- runFlow:
    when:
      visible:
        id: "open-review-tray-btn"
    commands:
      - tapOn:
          id: "open-review-tray-btn"
      - extendedWaitUntil:
          visible:
            id: "submit-review-btn"
          timeout: 10000
      - tapOn:
          id: "submit-review-btn"
      - extendedWaitUntil:
          visible:
            id: "review-success-tray"
          timeout: 20000
          optional: true
      - tapOn:
          text: "Done"
          optional: true
- assertVisible:
    id: "order-tracking-screen"
