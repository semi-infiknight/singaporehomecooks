# Tab bar + route smoke — guest browse, sign-in, main tabs, cook profile deep link
# Covers: CustomerTabBar crash fix, cook/[slug]/index route, guest cart bar
appId: com.singaporehomecooks.customer
---
- launchApp:
    clearState: true
    clearKeychain: true
- runFlow: customer-onboarding-if-needed.yaml
- extendedWaitUntil:
    visible:
      id: "customer-discover-screen"
    timeout: 120000
- extendedWaitUntil:
    visible:
      id: "cuisine-gourmeat-row"
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: "guest-browse-bar"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "bottom-tab-bar"
    timeout: 30000
# Guest: Orders opens without auth tray (guest-first)
- tapOn:
    id: "orders-tab"
- extendedWaitUntil:
    visible:
      id: "customer-orders-screen"
    timeout: 60000
- assertNotVisible:
    text: "Sign in to view orders"
    optional: true
# Profile opens from discover header avatar (not a tab)
- tapOn:
    id: "gourmeat-profile-avatar"
- extendedWaitUntil:
    visible:
      id: "customer-profile-screen"
    timeout: 60000
    optional: true
- back
    optional: true
- tapOn:
    id: "discover-tab"
- extendedWaitUntil:
    visible:
      id: "customer-discover-screen"
    timeout: 60000
# Cook profile route (layout fix: cook/[slug]/index)
- openLink: shc-customer:///(customer)/cook/auntie-rose-tampines
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible:
      id: "kitchen-page-screen"
    timeout: 60000
    optional: true
