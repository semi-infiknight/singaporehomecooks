# Customer app — guest browse + sign in (Railway backend)
# Run: pnpm ios:dev && maestro test apps/mobile-customer/e2e/customer-auth.yaml
appId: com.singaporehomecooks.customer
---
- launchApp:
    clearState: true
    clearKeychain: true
- runFlow: customer-onboarding-if-needed.yaml
- extendedWaitUntil:
    visible:
      id: "customer-discover-screen"
    timeout: 120000
- extendedWaitUntil:
    visible:
      id: "cuisine-gourmeat-row"
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: "guest-browse-bar"
    timeout: 30000
- tapOn:
    id: "guest-browse-bar-cta"
- extendedWaitUntil:
    visible:
      id: "auth-submit-btn"
    timeout: 30000
- tapOn:
    id: "auth-email-input"
- eraseText
- inputText: customer@shc.local
- tapOn:
    id: "auth-password-input"
- eraseText
- inputText: customersecret
- tapOn:
    id: "auth-submit-btn"
- tapOn:
    text: "OK"
    optional: true
- extendedWaitUntil:
    visible:
      id: "bottom-tab-bar"
    timeout: 120000
- extendedWaitUntil:
    visible:
      id: "customer-discover-screen"
    timeout: 60000
- assertVisible:
    id: "cuisine-gourmeat-row"
