# Customer app — guest browse + WhatsApp phone sign in (Railway backend)
# Run: pnpm ios:dev && maestro test apps/mobile-customer/e2e/customer-auth.yaml
appId: com.singaporehomecooks.customer
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "customer-discover-screen"
    timeout: 120000
- openLink: shc-customer:///(shared)/auth
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible:
      id: "auth-submit-btn"
    timeout: 30000
- tapOn:
    id: "auth-mobile-input"
- eraseText
- inputText: "91234567"
- tapOn:
    id: "auth-submit-btn"
- extendedWaitUntil:
    visible:
      id: "auth-otp-input"
    timeout: 30000
- tapOn:
    id: "auth-otp-input"
- eraseText
- inputText: "123456"
- tapOn:
    id: "auth-submit-btn"
- tapOn:
    text: "OK"
    optional: true
- tapOn:
    id: "customer-onboarding-name"
    optional: true
- inputText: "Test Customer"
    optional: true
- tapOn:
    id: "onboarding-signin-cta"
    optional: true
- tapOn:
    id: "trust-onboarding-next-btn"
    optional: true
- tapOn:
    id: "onboarding-guest-btn"
    optional: true
- extendedWaitUntil:
    visible:
      id: "bottom-tab-bar"
    timeout: 120000
