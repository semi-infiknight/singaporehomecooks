# Customer signed in on discover (subflow) — WhatsApp phone auth.
appId: com.singaporehomecooks.customer
---
- runFlow:
    when:
      visible: "Sign in"
    commands:
      - openLink: shc-customer:///(shared)/auth
      - tapOn:
          text: "Open"
          optional: true
      - extendedWaitUntil:
          visible:
            id: "auth-submit-btn"
          timeout: 30000
      - tapOn:
          id: "auth-mobile-input"
      - eraseText
      - inputText: "91234567"
      - tapOn:
          id: "auth-submit-btn"
      - extendedWaitUntil:
          visible:
            id: "auth-otp-input"
          timeout: 30000
      - tapOn:
          id: "auth-otp-input"
      - eraseText
      - inputText: "123456"
      - tapOn:
          id: "auth-submit-btn"
      - tapOn:
          text: "OK"
          optional: true
      # Profile onboarding if shown
      - tapOn:
          id: "customer-onboarding-name"
          optional: true
      - inputText: "Test Customer"
          optional: true
      - tapOn:
          id: "onboarding-signin-cta"
          optional: true
      - tapOn:
          id: "trust-onboarding-next-btn"
          optional: true
      - tapOn:
          id: "onboarding-guest-btn"
          optional: true
- extendedWaitUntil:
    visible:
      id: "customer-discover-screen"
    timeout: 120000
