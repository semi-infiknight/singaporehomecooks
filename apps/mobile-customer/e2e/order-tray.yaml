# Customer order review + dispute trays (Family Values)
# Prereq: EXPO_PUBLIC_MAESTRO_E2E=1 in Metro + fv-e2e-preflight PASS
# Run: maestro test --device <id> apps/mobile-customer/e2e/order-tray.yaml
appId: com.singaporehomecooks.customer
---
- launchApp:
    stopApp: true
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "customer-discover-screen"
    timeout: 120000
- openLink: shc-customer:///(shared)/auth
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible:
      id: "auth-submit-btn"
    timeout: 30000
- tapOn:
    id: "auth-submit-btn"
- tapOn:
    text: "OK"
    optional: true
- extendedWaitUntil:
    visible:
      id: "customer-discover-screen"
    timeout: 120000
- openLink: shc-customer:///(customer)/orders/order-e2e-review
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible:
      id: "order-tracking-screen"
    timeout: 60000
- scrollUntilVisible:
    element:
      id: "open-review-tray-btn"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "open-review-tray-btn"
- extendedWaitUntil:
    visible:
      id: "shc-tray-order-review"
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "order-review-tray"
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "submit-review-btn"
    timeout: 8000
- tapOn:
    id: "submit-review-btn"
- extendedWaitUntil:
    visible:
      id: "review-success-tray"
    timeout: 20000
- tapOn:
    id: "review-success-tray-primary"
    optional: true
- tapOn:
    text: "Done"
    optional: true
- tapOn:
    id: "shc-tray-nav"
    optional: true
- scrollUntilVisible:
    element:
      id: "open-dispute-tray-btn"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "open-dispute-tray-btn"
- extendedWaitUntil:
    visible:
      id: "shc-tray-order-dispute"
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "submit-dispute-btn"
    timeout: 8000
- tapOn:
    id: "submit-dispute-btn"
- extendedWaitUntil:
    visible:
      id: "dispute-success-tray"
    timeout: 20000