# Customer app — full order path (browse → cart → checkout → PayNow)
# Run customer yaml first; cook fulfil in apps/mobile-cook/e2e/full-order-fulfil.yaml
appId: com.singaporehomecooks.customer
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "customer-discover-screen"
    timeout: 120000
- openLink: shc-customer:///(shared)/auth
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible:
      id: "auth-submit-btn"
    timeout: 30000
- tapOn:
    id: "auth-submit-btn"
- tapOn:
    text: "OK"
    optional: true
- extendedWaitUntil:
    visible:
      id: "customer-discover-screen"
    timeout: 120000
- openLink: shc-customer:///(customer)/cart
- tapOn:
    text: "Open"
    optional: true
- runFlow:
    when:
      visible:
        id: "cart-item-0"
    commands:
      - tapOn: "Clear cart"
      - extendedWaitUntil:
          visible: "Cart is empty"
          timeout: 30000
- openLink: shc-customer:///(customer)/product/dish_nasi_lemak_prawn_001?allergenAck=1
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Nasi Lemak Sambal Prawn"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "pdp-sticky-ready"
    timeout: 30000
- tapOn:
    id: "add-to-cart-btn"
- runFlow:
    when:
      visible: "Sign in to order"
    commands:
      - tapOn: "Sign in"
      - extendedWaitUntil:
          visible:
            id: "auth-submit-btn"
          timeout: 30000
      - tapOn:
          id: "auth-submit-btn"
      - tapOn:
          text: "OK"
          optional: true
      - openLink: shc-customer:///(customer)/product/dish_nasi_lemak_prawn_001?allergenAck=1
      - tapOn:
          text: "Open"
          optional: true
      - extendedWaitUntil:
          visible:
            id: "pdp-sticky-ready"
          timeout: 30000
      - tapOn:
          id: "add-to-cart-btn"
- extendedWaitUntil:
    visible:
      id: "add-to-cart-success"
    timeout: 5000
    optional: true
- extendedWaitUntil:
    visible:
      id: "cart-screen"
    timeout: 120000
    optional: true
- extendedWaitUntil:
    visible:
      id: "cart-item-0"
    timeout: 120000
    optional: true
- openLink: shc-customer:///(customer)/cart
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible:
      id: "cart-screen"
    timeout: 90000
- extendedWaitUntil:
    visible:
      id: "cart-item-0"
    timeout: 90000
- scrollUntilVisible:
    element:
      id: "proceed-checkout"
    direction: DOWN
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "proceed-checkout"
    timeout: 30000
- tapOn:
    id: "proceed-checkout"
- extendedWaitUntil:
    visible:
      id: "checkout-screen"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: ".*18:00-19:00.*"
    direction: UP
    timeout: 20000
    optional: true
- scrollUntilVisible:
    element:
      text: ".*18:00-19:00.*"
    direction: DOWN
    timeout: 45000
- tapOn:
    id: "slot-.*-18:00-19:00"
- scrollUntilVisible:
    element:
      id: "allergen-ack"
    direction: DOWN
    timeout: 20000
- tapOn:
    text: ".*MANDATORY ALLERGEN.*"
- scrollUntilVisible:
    element:
      id: "pdpa-consent"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "pdpa-consent"
- tapOn:
    id: "pdpa-consent-box"
    optional: true
- scrollUntilVisible:
    element:
      id: "do-checkout"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "do-checkout"
- runFlow:
    when:
      visible: "Allergen acknowledgment"
    commands:
      - tapOn:
          text: ".*MANDATORY ALLERGEN.*"
      - tapOn:
          id: "allergen-tray-confirm"
      - scrollUntilVisible:
          element:
            id: "do-checkout"
          direction: DOWN
          timeout: 20000
      - tapOn:
          id: "do-checkout"
- extendedWaitUntil:
    visible:
      id: "paynow-ref-input"
    timeout: 120000
- tapOn:
    id: "paynow-ref-input"
- inputText: "TEST-REF-123"
- tapOn:
    text: "PayNow"
    optional: true
- tapOn:
    id: "confirm-paynow"
- extendedWaitUntil:
    visible:
      id: "order-tracking-screen"
    timeout: 60000
    optional: true